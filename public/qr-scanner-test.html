<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner Test Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1a202c;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 24px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #f0fdf4;
            border: 2px solid #22c55e;
            color: #15803d;
        }
        .result.error {
            background: #fef2f2;
            border: 2px solid #ef4444;
            color: #dc2626;
        }
        .result h3 {
            margin-bottom: 12px;
            font-size: 18px;
        }
        .result pre {
            background: rgba(0,0,0,0.05);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
        }
        .example {
            background: #f7fafc;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        .example-title {
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .example-code {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #4a5568;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 QR Scanner Test Tool</h1>
        <p class="subtitle">Test your QR code scanning API endpoint</p>

        <div class="example">
            <div class="example-title">Example QR Data Format:</div>
            <div class="example-code">{"id":1,"hash":"abc123...","employee_id":5,"date":"2026-04-22"}</div>
        </div>

        <form id="scanForm">
            <div class="form-group">
                <label for="apiUrl">API Endpoint URL</label>
                <input 
                    type="text" 
                    id="apiUrl" 
                    placeholder="https://your-domain.com/api/qr-scanner/scan"
                    value="http://localhost:8000/api/qr-scanner/scan"
                    required
                >
            </div>

            <div class="form-group">
                <label for="qrData">QR Code Data (JSON)</label>
                <textarea 
                    id="qrData" 
                    placeholder='{"id":1,"hash":"...","employee_id":5,"date":"2026-04-22"}'
                    required
                ></textarea>
            </div>

            <button type="submit">Send Scan Request</button>
        </form>

        <div id="result" class="result">
            <h3 id="resultTitle"></h3>
            <pre id="resultContent"></pre>
        </div>
    </div>

    <script>
        document.getElementById('scanForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const apiUrl = document.getElementById('apiUrl').value;
            const qrData = document.getElementById('qrData').value;
            const resultDiv = document.getElementById('result');
            const resultTitle = document.getElementById('resultTitle');
            const resultContent = document.getElementById('resultContent');

            // Hide previous result
            resultDiv.style.display = 'none';
            resultDiv.className = 'result';

            try {
                // Validate JSON
                JSON.parse(qrData);

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ qr_data: qrData })
                });

                const data = await response.json();

                // Show result
                resultDiv.style.display = 'block';
                
                if (data.success) {
                    resultDiv.classList.add('success');
                    resultTitle.textContent = '✅ Success!';
                } else {
                    resultDiv.classList.add('error');
                    resultTitle.textContent = '❌ Error';
                }

                resultContent.textContent = JSON.stringify(data, null, 2);

            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.classList.add('error');
                resultTitle.textContent = '❌ Request Failed';
                resultContent.textContent = error.message;
            }
        });
    </script>
</body>
</html>
